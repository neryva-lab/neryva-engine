    </pattern>
    <marker id="tarwLit" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M2.5,1.5 L6.5,4.5 L2.5,7.5" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#0A0A0E"/>

  <!-- ===== builder top bar ===== -->
  <rect x="0" width="1440" height="56" fill="#14141B" opacity="0.96"/>
  <path d="M0 56 H1440" stroke="#26262F"/>
  <path d="M28 28 L22 34 L28 40" fill="none" stroke="#A1A1A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="38" y="39" font-size="13" fill="#A1A1A6">Agents</text>
  <text x="100" y="39" font-size="15" font-weight="600" fill="#F5F5F7">Billing Support</text>
  <rect x="228" y="21" width="52" height="21" rx="10.5" fill="#0A84FF" opacity="0.16"/>
  <text x="254" y="35" font-size="11" text-anchor="middle" fill="#0A84FF">Draft</text>
  <circle cx="1124" cy="28" r="4" fill="#30D158"/>
  <text x="1136" y="32" font-size="11" fill="#8E8E93">Saved</text>
  <text x="1416" y="39" font-size="13" text-anchor="end" fill="#0A84FF">Library →</text>

  <!-- ===== side menu: component palette (Tools open) ===== -->
  <rect x="0" y="56" width="216" height="776" fill="#0E0E13"/>
  <path d="M216 56 V832" stroke="#26262F"/>
  <text x="20" y="88" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">COMPONENTS</text>
  <text x="20" y="122" font-size="10" font-weight="600" letter-spacing="0.9" fill="#636366">FOUNDATIONS</text>
  <g>
    <rect x="20" y="130" width="176" height="40" rx="10" fill="#14141B" stroke="#26262F"/>
    <text x="56" y="147" font-size="12" font-weight="600" fill="#F5F5F7">Purpose</text>
    <text x="56" y="162" font-size="10" fill="#30D158">on canvas ✓</text>
  </g>
  <g>
    <rect x="20" y="176" width="176" height="40" rx="10" fill="#14141B" stroke="#26262F"/>
    <text x="56" y="193" font-size="12" font-weight="600" fill="#F5F5F7">Model</text>
    <text x="56" y="208" font-size="10" fill="#30D158">on canvas ✓</text>
  </g>
  <text x="20" y="242" font-size="10" font-weight="600" letter-spacing="0.9" fill="#636366">SOURCES</text>
  <g>
    <rect x="20" y="250" width="176" height="40" rx="10" fill="#14141B" stroke="#26262F"/>
    <text x="56" y="267" font-size="12" font-weight="600" fill="#F5F5F7">Knowledge</text>
