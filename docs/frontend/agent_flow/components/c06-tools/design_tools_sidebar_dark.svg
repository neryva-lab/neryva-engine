    <circle cx="886" cy="262" r="4" fill="#30D158"/>
    <text x="898" y="259" font-weight="600" fill="#F5F5F7">lookup_ticket</text>
    <text x="898" y="273" font-size="10" fill="#8E8E93">READ_ONLY · approval none · live</text>
    <rect x="1010" y="252" width="38" height="16" rx="8" fill="none" stroke="#3A3A3F"/>
    <text x="1029" y="264" font-size="9" text-anchor="middle" fill="#8E8E93">v3 ✓</text>
    <rect x="872" y="297" width="188" height="62" rx="9" fill="#0A0A0E" stroke="#FF9F0A" stroke-opacity="0.5"/>
    <circle cx="886" cy="318" r="4" fill="#FF9F0A"/>
    <text x="898" y="315" font-weight="600" fill="#F5F5F7">refund_payment</text>
    <text x="898" y="329" font-size="10" fill="#FF9F0A">DESTRUCTIVE · approval required</text>
    <text x="898" y="343" font-size="10" fill="#0A84FF">shadow — simulated, executes nothing</text>
    <rect x="872" y="363" width="188" height="42" rx="9" fill="#0A0A0E" stroke="#FF453A" stroke-opacity="0.4"/>
    <circle cx="886" cy="384" r="4" fill="#FF453A"/>
    <text x="898" y="381" font-weight="600" fill="#F5F5F7">sync_crm</text>
    <text x="898" y="395" font-size="10" fill="#FF453A">pin stale — re-pin to v7</text>
  </g>
  <rect x="872" y="409" width="188" height="22" rx="11" fill="#A78BFA" opacity="0.12"/>
  <text x="966" y="424" font-size="11" text-anchor="middle" fill="#A78BFA">+ Bind from catalog</text>
  <text x="880" y="444" font-size="10" fill="#636366">unbind ≠ delete · stays in catalog</text>

  <!-- ===== inspector (dimmed) ===== -->
  <g opacity="0.4">
    <rect x="1080" y="56" width="360" height="776" fill="#0E0E13"/>
    <path d="M1080 56 V832" stroke="#26262F"/>
    <text x="1104" y="94" font-size="17" font-weight="600" fill="#F5F5F7">Tools</text>
    <text x="1104" y="114" font-size="12" fill="#8E8E93">2 bound · 1 needs approval setup</text>
    <rect x="1104" y="136" width="312" height="60" rx="12" fill="#14141B" stroke="#26262F"/>
    <rect x="1104" y="204" width="312" height="76" rx="12" fill="#14141B" stroke="#FF9F0A" stroke-opacity="0.5"/>
    <rect x="1104" y="288" width="312" height="60" rx="12" fill="#14141B" stroke="#FF453A" stroke-opacity="0.35"/>
  </g>

  <!-- ===== bottom action bar ===== -->
  <rect x="0" y="832" width="1440" height="68" fill="#14141B"/>
  <path d="M0 832 H1440" stroke="#26262F"/>
  <circle cx="28" cy="866" r="4" fill="#A78BFA"/>
  <text x="40" y="870" font-size="12" fill="#8E8E93">Tools are optional. 1 pin stale — publish refuses until re-pinned.</text>
  <text x="1064" y="871" font-size="13" text-anchor="middle" fill="#A1A1A6">Skip for now</text>
  <rect x="1212" y="846" width="128" height="40" rx="12" fill="#0A84FF"/>
  <text x="1276" y="871" font-size="14" font-weight="600" text-anchor="middle" fill="#FFF">Continue</text>
