  <path d="M34 346 h10 M39 341 v10" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>
  <text x="56" y="345" font-size="12" font-weight="600" fill="#F5F5F7">Tool</text>
  <text x="56" y="360" font-size="10" fill="#A78BFA">2 bound · T</text>
  <g font-size="11" font-weight="500" fill="#8E8E93">
    <rect x="30" y="368" width="156" height="28" rx="7" fill="#A78BFA" opacity="0.12"/>
    <text x="42" y="386" fill="#F5F5F7">Attach from catalog</text>
    <text x="42" y="414">Shadow a binding</text>
    <text x="42" y="442">Review drift</text>
  </g>
  <text x="20" y="500" font-size="10" font-weight="600" letter-spacing="0.9" fill="#636366">SAFEGUARDS</text>
  <g>
    <rect x="20" y="508" width="176" height="40" rx="10" fill="#14141B" stroke="#26262F"/>
    <text x="56" y="525" font-size="12" font-weight="600" fill="#F5F5F7">Guardrail</text>
    <text x="56" y="540" font-size="10" fill="#8E8E93">defaults active</text>
  </g>
  <g font-size="10" fill="#636366">
    <text x="20" y="764">N search · T tools · ⇧K knowledge</text>
    <text x="20" y="780">⌘S save · Del detach</text>
  </g>

  <!-- ===== canvas (dimmed; Tools satellite lit) ===== -->
  <g opacity="0.4">
    <rect x="216" y="56" width="864" height="776" fill="url(#tdots)"/>
    <g fill="#14141B" stroke="#26262F">
      <rect x="640" y="110" width="170" height="62" rx="14"/>
      <rect x="640" y="214" width="170" height="62" rx="14"/>
      <rect x="640" y="318" width="170" height="62" rx="14"/>
    </g>
    <g font-size="13" font-weight="600" fill="#F5F5F7">
      <text x="688" y="139">Purpose</text><text x="688" y="243">Context</text><text x="688" y="347">Model</text>
    </g>
  </g>
  <!-- lit leg: Tools → Model (capabilities feed the brain) -->
  <path d="M812 300 C790 300 786 340 780 345" fill="none" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#tarwLit)"/>
  <!-- Tools satellite: hash-pin rows with effect × approval × shadow -->
  <rect x="852" y="196" width="228" height="8" rx="4" fill="none" stroke="#A78BFA" stroke-opacity="0.25" stroke-width="8"/>
  <g filter="url(#tnd)">
