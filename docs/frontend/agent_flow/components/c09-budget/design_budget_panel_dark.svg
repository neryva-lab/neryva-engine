<svg width="1440" height="1000" viewBox="0 0 1440 1000" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <defs>
    <filter id="pnd" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1440" height="1000" fill="#0A0A0E"/>

  <rect x="0" width="1440" height="56" fill="#14141B" opacity="0.96"/>
  <path d="M0 56 H1440" stroke="#26262F"/>
  <text x="38" y="39" font-size="13" fill="#A1A1A6">Agents</text>
  <text x="100" y="39" font-size="15" font-weight="600" fill="#F5F5F7">Billing Support</text>
  <text x="1416" y="39" font-size="13" text-anchor="end" fill="#8E8E93">detail</text>

  <text x="48" y="104" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">AGENT DETAIL · READ-ONLY PANEL</text>
  <g filter="url(#pnd)">
    <rect x="48" y="116" width="1344" height="330" rx="12" fill="#14141B" stroke="#26262F"/>
    <text x="72" y="148" font-size="14" font-weight="600" fill="#F5F5F7">Budget</text>
    <rect x="150" y="134" width="150" height="22" rx="11" fill="#30D158" opacity="0.16"/>
    <text x="225" y="149" text-anchor="middle" font-size="11" fill="#30D158">Capped · ~$2.40 rough</text>
    <text x="1330" y="148" font-size="12" text-anchor="end" fill="#0A84FF">Edit in builder ›</text>

    <circle cx="76" cy="174" r="4" fill="#30D158"/>
    <text x="88" y="178" font-size="12" fill="#A1A1A6">Spend cap $5.00 — breach fails the run closed.</text>
    <circle cx="76" cy="198" r="4" fill="#30D158"/>
    <text x="88" y="202" font-size="12" fill="#A1A1A6">20,000 tokens · 30 model calls · 12 tool calls · 10 min wall clock</text>
    <circle cx="76" cy="222" r="4" fill="#8E8E93"/>
    <text x="88" y="226" font-size="12" fill="#8E8E93">Unset dims serve platform defaults — 200k tokens · 16/8 calls · 120s.</text>

    <text x="72" y="258" font-size="11" font-weight="600" letter-spacing="0.7" fill="#8E8E93">ESTIMATE · ROUGH, NOT THE BILL</text>
    <text x="72" y="280" font-size="12" fill="#A1A1A6">acme/sonnet — in $3.0000 · cached-in $0.3000 · out $15.0000 /1k → ~$2.40 per 20k-token run</text>
    <text x="72" y="300" font-size="12" fill="#8E8E93">acme/haiku — unpriced. Cached price shown only when the catalog reports it.</text>

    <text x="72" y="332" font-size="12" fill="#A1A1A6">Breach: FAILED + terminal event naming the dimension + quota released.</text>
    <text x="72" y="356" font-size="12" fill="#8E8E93">Budget edits ship with the version — publish to serve them.</text>
    <text x="72" y="410" font-size="12" fill="#0A84FF">Open Usage (measured) ›</text>
  </g>

  <text x="48" y="490" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">SPEND TRUTH · KEPT, LINKED, NEVER DUPLICATED</text>
  <g filter="url(#pnd)">
    <rect x="48" y="502" width="1344" height="120" rx="12" fill="#14141B" stroke="#26262F"/>
    <text x="72" y="534" font-size="14" font-weight="600" fill="#F5F5F7">Usage</text>
    <text x="72" y="556" font-size="12" fill="#8E8E93">Tokens, cost, and quota for your agents — measured by the engine, not estimated.</text>
    <text x="72" y="580" font-size="12" fill="#636366">No changes in C09 — the panel links out instead of copying numbers.</text>
    <text x="1330" y="556" font-size="12" text-anchor="end" fill="#0A84FF">/agent-studio/usage ›</text>
  </g>

  <text x="48" y="666" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">SHORTCUT · FIRST LOCK TEST</text>
  <g filter="url(#pnd)">
    <rect x="48" y="678" width="1344" height="150" rx="12" fill="#14141B" stroke="#26262F"/>
    <text x="72" y="708" font-size="12" fill="#A1A1A6">S summons Budget — free studio-wide and in-builder, verified against the registry.</text>
    <text x="72" y="730" font-size="12" fill="#A1A1A6">slot-model.test.ts pins the full kind→shortcut map + uniqueness. Future adds/moves update it.</text>
    <text x="72" y="752" font-size="12" fill="#636366">t tools · g guardrails · b brand · e evaluation · s budget · ⇧K knowledge · ⇧M memory</text>
    <text x="72" y="792" font-size="12" fill="#636366">Budget is not skippable — platform defaults are runtime truth (guardrails precedent).</text>
  </g>
</svg>
