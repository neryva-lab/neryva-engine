  <circle cx="30" cy="116" r="5" fill="#0A84FF"/><text x="44" y="120" font-size="13" fill="#F5F5F7">Knowledge</text>
  <circle cx="30" cy="146" r="5" fill="#A78BFA"/><text x="44" y="150" font-size="13" fill="#F5F5F7">Tools</text>
  <circle cx="30" cy="176" r="5" fill="#FF9F0A"/><text x="44" y="180" font-size="13" fill="#F5F5F7">Memory</text>
  <circle cx="30" cy="206" r="5" fill="#64D2FF"/><text x="44" y="210" font-size="13" font-weight="600" fill="#F5F5F7">Budget</text>
  <rect x="14" y="192" width="188" height="30" rx="8" fill="#64D2FF" opacity="0.12"/>
  <text x="150" y="211" font-size="11" fill="#8E8E93">S</text>

  <rect x="216" y="56" width="824" height="1164" fill="#0A0A0E"/>
  <rect x="216" y="56" width="824" height="1164" fill="url(#bdots)"/>
  <g filter="url(#bnd)">
    <rect x="480" y="430" width="300" height="150" rx="14" fill="#14141B" stroke="#64D2FF" stroke-width="1.5"/>
    <circle cx="504" cy="462" r="6" fill="#30D158"/>
    <text x="518" y="467" font-size="14" font-weight="600" fill="#F5F5F7">Budget</text>
    <text x="504" y="492" font-size="12" fill="#A1A1A6">Capped · ~$2.40 rough</text>
    <text x="504" y="514" font-size="11" fill="#8E8E93">20k tokens · $5 cap · 30 model calls</text>
    <text x="504" y="552" font-size="11" fill="#636366">S · Cost and time guardrails</text>
  </g>

  <rect x="1040" y="56" width="400" height="1164" fill="#101014"/>
  <path d="M1040 56 V1220" stroke="#26262F"/>
  <text x="1064" y="96" font-size="15" font-weight="600" fill="#F5F5F7">Budget</text>
  <text x="1064" y="116" font-size="12" fill="#8E8E93">Capped · ~$2.40 rough</text>

  <text x="1064" y="150" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">CAPS · PER-RUN</text>
  <text x="1064" y="176" font-size="13" fill="#F5F5F7">Spend cap</text>
  <text x="1064" y="194" font-size="12" fill="#8E8E93">$5.00 — breach fails the run closed.</text>
  <rect x="1064" y="202" width="200" height="32" rx="9" fill="#1C1C22" stroke="#3A3A42"/>
  <text x="1078" y="222" font-size="13" fill="#F5F5F7">$ 5.00</text>

  <text x="1064" y="256" font-size="13" fill="#F5F5F7">Total tokens</text>
  <text x="1064" y="274" font-size="12" fill="#8E8E93">20,000 set · platform serves 200,000 unset.</text>
  <rect x="1064" y="282" width="200" height="32" rx="9" fill="#1C1C22" stroke="#3A3A42"/>
  <text x="1078" y="302" font-size="13" fill="#F5F5F7">20,000</text>

  <text x="1064" y="336" font-size="13" fill="#F5F5F7">Model calls</text>
  <text x="1064" y="354" font-size="12" fill="#8E8E93">30 set · serves 16 unset · min 1, no disable.</text>
  <text x="1064" y="372" font-size="11" fill="#8E8E93">Unset spend = no cap: runs are cost-unchecked.</text>

  <text x="1064" y="406" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">ESTIMATE · ROUGH, NOT THE BILL</text>
  <text x="1064" y="430" font-size="12" fill="#A1A1A6">acme/sonnet — in $3.0000 · cached-in $0.3000 · out $15.0000 /1k</text>
  <text x="1064" y="448" font-size="12" fill="#A1A1A6">acme/haiku — unpriced. Estimates need a priced model.</text>
  <text x="1064" y="470" font-size="13" font-weight="600" fill="#F5F5F7">~$2.40 for a 20k-token run on Sonnet</text>
  <text x="1064" y="488" font-size="11" fill="#8E8E93">Uncached rates. Measured spend lives in Usage.</text>

  <text x="1064" y="522" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">IF A CAP BREAKS</text>
  <text x="1064" y="544" font-size="12" fill="#A1A1A6">The run fails closed — FAILED, terminal event naming</text>
  <text x="1064" y="560" font-size="12" fill="#A1A1A6">the dimension, quota released.</text>
  <text x="1064" y="582" font-size="12" fill="#0A84FF">Open Usage (measured) ›</text>

  <rect x="1064" y="608" width="352" height="66" rx="10" fill="#1C1C22" stroke="#3A3A42"/>
  <text x="1080" y="632" font-size="12" fill="#A1A1A6">Viewers see this read-only. Owners, admins,</text>
  <text x="1080" y="648" font-size="12" fill="#A1A1A6">and developers can edit drafts.</text>

  <text x="1064" y="1180" font-size="11" fill="#636366">Autosaves in 8s · full draft · 409 adopts · 412 merges</text>
</svg>
