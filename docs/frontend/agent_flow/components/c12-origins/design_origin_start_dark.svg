<svg width="1440" height="1220" viewBox="0 0 1440 1220" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <defs>
    <filter id="bnd" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="bdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1440" height="1220" fill="#0A0A0E"/>

  <rect x="0" width="1440" height="56" fill="#14141B" opacity="0.96"/>
  <path d="M0 56 H1440" stroke="#26262F"/>
  <text x="38" y="39" font-size="13" fill="#A1A1A6">Agents</text>
  <text x="100" y="39" font-size="15" font-weight="600" fill="#F5F5F7">New agent</text>
  <text x="1416" y="39" font-size="13" text-anchor="end" fill="#0A84FF">Library</text>

  <rect x="216" y="56" width="1224" height="1164" fill="#0A0A0E"/>
  <rect x="216" y="56" width="1224" height="1164" fill="url(#bdots)"/>

  <text x="500" y="150" font-size="22" font-weight="600" fill="#F5F5F7">Start from a template, a copy, a file — or blank</text>
  <text x="500" y="174" font-size="13" fill="#8E8E93">Clones copy into a new draft. Imports validate first, then land as a draft. Nothing goes live.</text>

  <g filter="url(#bnd)">
    <rect x="280" y="220" width="260" height="150" rx="14" fill="#14141B" stroke="#3A3A42"/>
    <text x="304" y="254" font-size="14" font-weight="600" fill="#F5F5F7">Clone an agent</text>
    <text x="304" y="278" font-size="12" fill="#A1A1A6">Search this org, pick a source,</text>
    <text x="304" y="296" font-size="12" fill="#A1A1A6">name the copy. Original untouched.</text>
    <rect x="304" y="314" width="180" height="36" rx="9" fill="transparent" stroke="#3A3A42"/>
    <text x="394" y="337" font-size="13" text-anchor="middle" fill="#A1A1A6">Pick a source →</text>
  </g>

  <g filter="url(#bnd)">
    <rect x="570" y="220" width="260" height="150" rx="14" fill="#14141B" stroke="#3A3A42"/>
    <text x="594" y="254" font-size="14" font-weight="600" fill="#F5F5F7">Import a file</text>
    <text x="594" y="278" font-size="12" fill="#A1A1A6">Paste or drop an export.</text>
    <text x="594" y="296" font-size="12" fill="#A1A1A6">Validated here, draft on create.</text>
    <rect x="594" y="314" width="180" height="36" rx="9" fill="transparent" stroke="#3A3A42"/>
    <text x="684" y="337" font-size="13" text-anchor="middle" fill="#A1A1A6">Choose a file →</text>
  </g>

  <text x="280" y="420" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">CLONE PICKER · SEARCH + STATUS + COPY WARNING</text>

  <g filter="url(#bnd)">
    <rect x="280" y="436" width="550" height="300" rx="14" fill="#14141B" stroke="#3A3A42"/>
    <rect x="304" y="460" width="300" height="32" rx="9" fill="#1C1C22" stroke="#3A3A42"/>
    <text x="320" y="480" font-size="12" fill="#636366">Search name…</text>
    <rect x="304" y="504" width="502" height="52" rx="10" fill="#1C1C22" stroke="#0A84FF" stroke-width="1"/>
    <circle cx="324" cy="530" r="5" fill="#30D158"/>
    <text x="336" y="526" font-size="13" font-weight="600" fill="#F5F5F7">Returns Helper</text>
    <text x="336" y="544" font-size="11" fill="#8E8E93">live · edited 12 Feb · DRAFT present — copies the draft</text>
    <rect x="304" y="564" width="502" height="44" rx="10" fill="transparent" stroke="#3A3A42"/>
    <circle cx="324" cy="586" r="5" fill="#8E8E93"/>
    <text x="336" y="582" font-size="13" fill="#F5F5F7">Billing Auditor</text>
    <text x="336" y="598" font-size="11" fill="#8E8E93">new · never published</text>
    <rect x="304" y="620" width="502" height="40" rx="10" fill="#FF9F0A" opacity="0.10"/>
    <text x="320" y="638" font-size="12" fill="#FF9F0A">The original is untouched — edits land on the copy.</text>
    <text x="320" y="654" font-size="11" fill="#8E8E93">☐ Don’t show again</text>
    <rect x="304" y="668" width="300" height="34" rx="9" fill="#1C1C22" stroke="#3A3A42"/>
    <text x="320" y="690" font-size="13" fill="#F5F5F7">Returns Helper (copy)</text>
    <text x="620" y="690" font-size="12" fill="#0A84FF">Clone agent</text>
  </g>

  <text x="880" y="420" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">AFTER CLONE · LANDING</text>
  <g filter="url(#bnd)">
    <rect x="880" y="436" width="380" height="130" rx="14" fill="#14141B" stroke="#30D158" stroke-width="1.5"/>
    <text x="904" y="468" font-size="13" font-weight="600" fill="#F5F5F7">Cloned “Returns Helper”</text>
    <text x="904" y="490" font-size="12" fill="#A1A1A6">New draft on the circuit — the original</text>
    <text x="904" y="508" font-size="12" fill="#A1A1A6">was not touched. Recorded in Audit ›</text>
    <text x="904" y="534" font-size="11" fill="#8E8E93">All three entries land here — build, never edit.</text>
  </g>

  <text x="280" y="790" font-size="11" fill="#636366">No new shortcut — overlays are pointer-driven · warn-once is dismissible, not per-session</text>
</svg>
