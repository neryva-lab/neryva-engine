<svg width="1440" height="1220" viewBox="0 0 1440 1220" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <defs>
    <filter id="bnd" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="bdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1440" height="1220" fill="#0A0A0E"/>

  <rect x="0" width="1440" height="56" fill="#14141B" opacity="0.96"/>
  <path d="M0 56 H1440" stroke="#26262F"/>
  <text x="38" y="39" font-size="13" fill="#A1A1A6">Agents</text>
  <text x="100" y="39" font-size="15" font-weight="600" fill="#F5F5F7">Returns Helper</text>
  <rect x="228" y="21" width="52" height="21" rx="10.5" fill="#0A84FF" opacity="0.16"/>
  <text x="254" y="35" font-size="11" text-anchor="middle" fill="#0A84FF">Draft</text>
  <circle cx="1124" cy="28" r="4" fill="#30D158"/>
  <text x="1136" y="32" font-size="11" fill="#8E8E93">Saved</text>
  <text x="1416" y="39" font-size="13" text-anchor="end" fill="#0A84FF">Library</text>

  <rect x="0" y="56" width="216" height="1164" fill="#0E0E13"/>
  <path d="M216 56 V1220" stroke="#26262F"/>
  <text x="20" y="88" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">COMPONENTS</text>
  <circle cx="30" cy="116" r="5" fill="#0A84FF"/><text x="44" y="120" font-size="13" fill="#F5F5F7">Knowledge</text>
  <circle cx="30" cy="146" r="5" fill="#A78BFA"/><text x="44" y="150" font-size="13" fill="#F5F5F7">Tools</text>
  <circle cx="30" cy="176" r="5" fill="#FF9F0A"/><text x="44" y="180" font-size="13" fill="#F5F5F7">Memory</text>
  <circle cx="30" cy="206" r="5" fill="#64D2FF"/><text x="44" y="210" font-size="13" fill="#F5F5F7">Budget</text>
  <circle cx="30" cy="236" r="5" fill="#30D158"/><text x="44" y="240" font-size="13" font-weight="600" fill="#F5F5F7">Response</text>
  <rect x="14" y="222" width="188" height="30" rx="8" fill="#30D158" opacity="0.12"/>
  <text x="150" y="241" font-size="11" fill="#8E8E93">spine</text>

  <rect x="216" y="56" width="824" height="1164" fill="#0A0A0E"/>
  <rect x="216" y="56" width="824" height="1164" fill="url(#bdots)"/>
  <g filter="url(#bnd)">
    <rect x="480" y="430" width="300" height="150" rx="14" fill="#14141B" stroke="#30D158" stroke-width="1.5"/>
    <circle cx="504" cy="462" r="6" fill="#30D158"/>
    <text x="518" y="467" font-size="14" font-weight="600" fill="#F5F5F7">Response</text>
    <text x="504" y="492" font-size="12" fill="#A1A1A6">Tried · last try 2m ago</text>
    <text x="504" y="514" font-size="11" fill="#8E8E93">v3 draft · thread kept in Try</text>
    <text x="504" y="552" font-size="11" fill="#636366">spine · Try it before you ship it</text>
  </g>

  <rect x="1040" y="56" width="400" height="1164" fill="#101014"/>
  <path d="M1040 56 V1220" stroke="#26262F"/>
  <text x="1064" y="96" font-size="15" font-weight="600" fill="#F5F5F7">Try</text>
  <text x="1064" y="116" font-size="12" fill="#8E8E93">Tried · v3 draft · never billed</text>

  <text x="1064" y="150" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">RUNS AGAINST</text>
  <rect x="1064" y="160" width="352" height="34" rx="9" fill="#1C1C22" stroke="#3A3A42"/>
  <text x="1080" y="182" font-size="13" fill="#F5F5F7">v3 · DRAFT · a41f9c…</text>

  <text x="1064" y="222" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">BEFORE YOU RUN</text>
  <rect x="1064" y="232" width="352" height="44" rx="10" fill="#FF9F0A" opacity="0.10"/>
  <text x="1080" y="250" font-size="12" fill="#FF9F0A">No instructions yet — try runs, publish refuses.</text>
  <text x="1080" y="266" font-size="11" fill="#8E8E93">Advisory only here. Edit in Purpose ›</text>

  <text x="1064" y="304" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">THREAD</text>
  <rect x="1064" y="314" width="280" height="52" rx="10" fill="#1C1C22" stroke="#3A3A42"/>
  <text x="1080" y="334" font-size="11" fill="#8E8E93">You</text>
  <text x="1080" y="352" font-size="13" fill="#F5F5F7">Where is my refund?</text>
  <rect x="1064" y="374" width="320" height="70" rx="10" fill="transparent" stroke="#3A3A42"/>
  <text x="1080" y="394" font-size="11" fill="#8E8E93">Returns Helper</text>
  <text x="1080" y="412" font-size="13" fill="#F5F5F7">Refunds land 5–10 days after</text>
  <text x="1080" y="430" font-size="13" fill="#F5F5F7">we receive the return…</text>
  <rect x="1064" y="452" width="180" height="30" rx="15" fill="#1C1C22" stroke="#3A3A42"/>
  <circle cx="1080" cy="467" r="3" fill="#8E8E93"/><circle cx="1090" cy="467" r="3" fill="#8E8E93"/><circle cx="1100" cy="467" r="3" fill="#8E8E93"/>
  <text x="1112" y="471" font-size="11" fill="#8E8E93">streaming…</text>

  <rect x="1064" y="492" width="150" height="24" rx="12" fill="#0A84FF" opacity="0.14"/>
  <text x="1078" y="508" font-size="11" fill="#0A84FF">Tool call · lookup_order</text>
  <rect x="1222" y="492" width="120" height="24" rx="12" fill="#8E8E93" opacity="0.14"/>
  <text x="1234" y="508" font-size="11" fill="#8E8E93">1,204 tokens</text>

  <rect x="1064" y="528" width="352" height="66" rx="10" fill="#1C1C22" stroke="#3A3A42"/>
  <text x="1080" y="550" font-size="13" fill="#636366">Ask a follow-up… (1–8192)</text>
  <text x="1080" y="574" font-size="11" fill="#0A84FF">Send  ⏹ Stop</text>
  <text x="1330" y="574" font-size="11" fill="#8E8E93">Enter ↵</text>

  <text x="1064" y="624" font-size="12" fill="#0A84FF">Open trace — what the run saw ›</text>
  <text x="1064" y="646" font-size="11" fill="#8E8E93">Thread kept in ?try= — reload restores it.</text>
  <text x="1064" y="664" font-size="11" fill="#8E8E93">Test runs never bill, never reserve quota.</text>

  <rect x="1064" y="690" width="352" height="66" rx="10" fill="#1C1C22" stroke="#3A3A42"/>
  <text x="1080" y="714" font-size="12" fill="#A1A1A6">Viewers see the thread read-only. Owners,</text>
  <text x="1080" y="730" font-size="12" fill="#A1A1A6">admins, developers can run drafts.</text>

  <text x="1064" y="1180" font-size="11" fill="#636366">No autosave — runs only · 409 names the active run</text>
</svg>
