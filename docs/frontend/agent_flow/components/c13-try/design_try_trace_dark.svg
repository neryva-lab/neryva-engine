  <text x="918" y="354" font-size="12" fill="#F5F5F7">lookup_order · approved · read · ok</text>
  <text x="918" y="372" font-size="11" fill="#8E8E93">Second call ran shadow — simulated, gated nothing.</text>

  <text x="918" y="406" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">GUARDRAILS</text>
  <text x="918" y="428" font-size="12" fill="#F5F5F7">brand-safe · pass · blocking</text>
  <text x="918" y="446" font-size="12" fill="#FF9F0A">pii-redact · flagged · logging — logged, not blocked.</text>

