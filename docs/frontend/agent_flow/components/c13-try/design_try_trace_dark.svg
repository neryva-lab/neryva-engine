  <text x="918" y="502" font-size="12" fill="#F5F5F7">acme/sonnet · 1,204 tokens · reported by Studio</text>
  <text x="918" y="520" font-size="11" fill="#8E8E93">Test runs write no bill row — estimates live in Budget.</text>

  <text x="918" y="554" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">STOP LINES</text>
  <rect x="918" y="564" width="456" height="52" rx="10" fill="#FF453A" opacity="0.10"/>
  <text x="934" y="586" font-size="12" fill="#FF453A">FAILED · budget_exceeded_wall_clock (120s).</text>
  <text x="934" y="602" font-size="11" fill="#8E8E93">Wall-clock stops fail closed. Cost lines report only.</text>

  <text x="918" y="650" font-size="12" fill="#0A84FF">Re-ask ↻ · Adjust in builder →</text>
