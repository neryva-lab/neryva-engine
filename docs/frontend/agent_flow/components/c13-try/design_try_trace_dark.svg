  <text x="1352" y="130" font-size="12" fill="#8E8E93">Esc ✕</text>

  <text x="918" y="184" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8E8E93">RETRIEVED · REPORTED ONLY</text>
