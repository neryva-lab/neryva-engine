  <text x="82" y="480" font-size="13" fill="#F5F5F7">And for gift orders?</text>
  <rect x="66" y="502" width="200" height="30" rx="15" fill="#1C1C22" stroke="#3A3A42"/>
  <circle cx="82" cy="517" r="3" fill="#8E8E93"/><circle cx="92" cy="517" r="3" fill="#8E8E93"/><circle cx="102" cy="517" r="3" fill="#8E8E93"/>
