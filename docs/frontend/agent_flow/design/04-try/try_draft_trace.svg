  <text x="388" y="240" font-size="11" fill="#A1A1A6">Billing Support · draft · Claude Sonnet 4.5</text>
  <g font-size="14" fill="#1D1D1F">
    <text x="368" y="270">Refunds for annual plans cancelled mid-term are</text>
    <text x="368" y="292">pro-rated to the last full month of service. Funds</text>
    <text x="368" y="314">return to the original payment method within</text>
    <text x="368" y="336">5 business days of approval.</text>
  </g>
