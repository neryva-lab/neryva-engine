  <rect x="576" y="348" width="62" height="24" rx="12" fill="#EAF9EF" stroke="#34C759" stroke-opacity="0.3"/>
  <circle cx="592" cy="360" r="4" fill="#34C759"/>
  <text x="620" y="364" font-size="11" text-anchor="middle" fill="#1E7A3C">Live</text>
