  <text x="296" y="74" font-size="13" fill="#8E8E93">Every agent’s voice, in one place — browse, compare, reuse. Nothing lives here without an agent.</text>
  <rect x="1180" y="28" width="120" height="36" rx="10" fill="none" stroke="#26262F"/>
  <text x="1240" y="51" font-size="13" text-anchor="middle" fill="#A1A1A6">Deep search: off</text>
  <rect x="1310" y="28" width="106" height="36" rx="10" fill="#0A84FF"/>
  <text x="1363" y="51" font-size="13" font-weight="600" text-anchor="middle" fill="#FFF">+ New agent</text>

  <!-- ===== tabs ===== -->
