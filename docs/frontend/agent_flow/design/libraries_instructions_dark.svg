  <text x="296" y="560" font-size="11" fill="#636366">+ 1 more · instruction text loads on expand (one read, cached).</text>

  <!-- ===== preview panel ===== -->
  <g filter="url(#nd3)"><rect x="836" y="180" width="580" height="560" rx="14" fill="#0E0E13" stroke="#26262F"/></g>
  <text x="860" y="214" font-size="15" font-weight="600" fill="#F5F5F7">Billing Support</text>
  <rect x="992" y="198" width="64" height="20" rx="10" fill="#30D158" opacity="0.14"/>
  <text x="1024" y="212" font-size="10" text-anchor="middle" fill="#30D158">Active v3</text>
  <rect x="1062" y="198" width="52" height="20" rx="10" fill="#0A84FF" opacity="0.14"/>
  <text x="1088" y="212" font-size="10" text-anchor="middle" fill="#0A84FF">Saved</text>
  <text x="1392" y="212" font-size="11" text-anchor="end" fill="#0A84FF">Open in builder →</text>

  <text x="860" y="244" font-size="10" font-weight="600" letter-spacing="0.8" fill="#636366">ROLE</text>
  <text x="860" y="262" font-size="12" fill="#F5F5F7">You are a billing concierge for Neryva. You answer</text>
  <text x="860" y="278" font-size="12" fill="#F5F5F7">from the pinned refund policy first, then general help.</text>
  <text x="860" y="304" font-size="10" font-weight="600" letter-spacing="0.8" fill="#636366">TASK</text>
  <text x="860" y="322" font-size="12" fill="#F5F5F7">Resolve refund questions in under 3 exchanges.</text>
  <text x="860" y="348" font-size="10" font-weight="600" letter-spacing="0.8" fill="#636366">RULES · 3</text>
  <g font-size="12" fill="#F5F5F7">
    <rect x="860" y="356" width="532" height="32" rx="9" fill="#0A0A0E" stroke="#26262F"/>
    <text x="876" y="377">Never promise a refund you cannot verify in policy.</text>
    <rect x="860" y="392" width="532" height="32" rx="9" fill="#0A0A0E" stroke="#26262F"/>
    <text x="876" y="413">Cite the policy section for every refund answer.</text>
    <rect x="860" y="428" width="532" height="32" rx="9" fill="#0A0A0E" stroke="#26262F"/>
    <text x="876" y="449">Escalate anything over $500 to a human.</text>
  </g>

  <text x="860" y="492" font-size="11" fill="#8E8E93">1,240 / 20,000 chars · ~310 tokens (est.)</text>
  <rect x="860" y="500" width="532" height="4" rx="2" fill="#26262F"/>
  <rect x="860" y="500" width="33" height="4" rx="2" fill="#30D158"/>

  <rect x="860" y="520" width="532" height="48" rx="11" fill="#FF9F0A" fill-opacity="0.08" stroke="#FF9F0A" stroke-opacity="0.3"/>
  <text x="876" y="540" font-size="11" font-weight="600" fill="#FF9F0A">Secrets: clean · unknown keys: none · 412-safe copy</text>
  <text x="876" y="556" font-size="11" fill="#FF9F0A">Copying re-validates against the target draft before writing.</text>

  <text x="860" y="600" font-size="11" font-weight="600" letter-spacing="0.8" fill="#636366">COPY TO AGENT</text>
  <rect x="860" y="610" width="300" height="38" rx="10" fill="#0A0A0E" stroke="#26262F"/>
  <text x="876" y="634" font-size="12" fill="#A1A1A6">Refund concierge-2 (draft open) ▾</text>
  <rect x="1170" y="610" width="110" height="38" rx="10" fill="#0A84FF"/>
  <text x="1225" y="634" font-size="13" font-weight="600" text-anchor="middle" fill="#FFF">Copy</text>
  <text x="1290" y="634" font-size="12" fill="#0A84FF">Compare +</text>
  <text x="860" y="676" font-size="11" fill="#636366">Writes through draft PUT + If-Match — 409s resume, never overwrite.</text>
  <text x="860" y="694" font-size="11" fill="#636366">Clone first if the target’s draft holds work you want to keep.</text>

