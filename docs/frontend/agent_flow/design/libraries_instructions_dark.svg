    <g filter="url(#nd3)"><rect x="296" y="180" width="520" height="64" rx="12" fill="#14141B" stroke="#0A84FF" stroke-width="1.3"/></g>
    <circle cx="318" cy="204" r="4" fill="#30D158"/>
    <text x="332" y="201" font-size="13" font-weight="600" fill="#F5F5F7">Billing Support</text>
    <text x="332" y="219" font-size="11" fill="#8E8E93">1,240 chars · 3 rules · active v3</text>
