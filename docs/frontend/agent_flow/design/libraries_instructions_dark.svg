      <circle cx="318" cy="420" r="4" fill="#8E8E93"/>
      <text x="332" y="417" font-size="13" font-weight="600" fill="#F5F5F7">Onboarding guide</text>
      <text x="332" y="435" font-size="11" fill="#8E8E93">2,104 chars · 5 rules · active v7</text>
      <text x="796" y="417" font-size="11" text-anchor="end" fill="#636366">1w ago</text>
