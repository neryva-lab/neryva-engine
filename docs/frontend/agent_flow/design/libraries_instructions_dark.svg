  <path d="M318 155 l3 3" stroke="#636366" stroke-width="1.5" stroke-linecap="round"/>
  <text x="328" y="155" font-size="12" fill="#636366">Search agents…  (name, instant)</text>
  <rect x="686" y="134" width="130" height="34" rx="9" fill="#0A0A0E" stroke="#26262F"/>
  <text x="700" y="155" font-size="12" fill="#A1A1A6">All agents ▾</text>
  <text x="826" y="155" font-size="11" fill="#636366">Deep search scans instruction text — explicit, capped at 25 agents.</text>

