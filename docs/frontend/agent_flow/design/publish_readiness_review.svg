  <text x="384" y="152" font-size="22" font-weight="600" letter-spacing="-0.3" fill="#1D1D1F">Ready to go live?</text>
  <text x="384" y="178" font-size="14" fill="#6E6E73">5 ready · 1 needs you · 2 skipped</text>

  <text x="384" y="216" font-size="11" font-weight="600" letter-spacing="0.9" fill="#A1A1A6">REQUIRED BY THE ENGINE</text>

