  <g font-size="14" fill="#1D1D1F">
    <circle cx="392" cy="248" r="5" fill="#34C759"/>
    <text x="412" y="245" font-weight="600">Instructions</text><text x="412" y="264" font-size="11" fill="#6E6E73">Role, task and 4 rules · 1,284 chars</text>
    <path d="M384 282 H944" stroke="#F0F0F3"/>

    <circle cx="392" cy="312" r="5" fill="#34C759"/>
    <text x="412" y="309" font-weight="600">Model</text><text x="412" y="328" font-size="11" fill="#6E6E73">Claude Sonnet 4.5 · Anthropic · fallback on</text>
