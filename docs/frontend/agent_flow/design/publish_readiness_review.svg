    <circle cx="392" cy="568" r="5" fill="#34C759"/>
    <text x="412" y="565" font-weight="600">Evaluation</text>
    <text x="412" y="584" font-size="11" fill="#6E6E73">PASS on this content hash · 24 of 24 cases</text>
  </g>

  <text x="384" y="628" font-size="11" font-weight="600" letter-spacing="0.9" fill="#A1A1A6">OPTIONAL — SKIPPED, NOT BLOCKING</text>
