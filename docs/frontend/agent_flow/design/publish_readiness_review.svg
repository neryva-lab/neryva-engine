    <text x="412" y="456" font-size="11" fill="#B25E00">faq-2026.pdf is 62% embedded for the current model</text>
    <path d="M384 474 H944" stroke="#F0F0F3"/>

    <circle cx="392" cy="504" r="5" fill="#34C759"/>
    <text x="412" y="501" font-weight="600">No blocking control blocks</text>
    <text x="412" y="520" font-size="11" fill="#6E6E73">No platform or org blocks on this agent, model or tools</text>
