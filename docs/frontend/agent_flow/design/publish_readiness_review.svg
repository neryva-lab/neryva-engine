    <circle cx="392" cy="660" r="5" fill="#C7C7CC"/>
    <text x="412" y="657">Guardrails</text><text x="412" y="676" font-size="11" fill="#A1A1A6">Platform defaults · input default, output brand-safe</text>
    <circle cx="392" cy="706" r="5" fill="#C7C7CC"/>
    <text x="412" y="703">Memory</text><text x="412" y="722" font-size="11" fill="#A1A1A6">Conversation scope · history limit 30 · summary on</text>
  </g>

  <!-- popover anchored to the amber row -->
  <g filter="url(#s6p)"><rect x="620" y="392" width="352" height="150" rx="14" fill="#FFF" stroke="#E5E5EA"/></g>
  <path d="M636 392 l9 -9 l9 9 z" fill="#FFF" stroke="#E5E5EA"/>
  <path d="M637 392 h17" stroke="#FFF" stroke-width="2"/>
  <text x="644" y="422" font-size="14" font-weight="600" fill="#1D1D1F">One source isn’t fully embedded</text>
  <text x="644" y="444" font-size="12" fill="#6E6E73">faq-2026.pdf will not be retrievable until the</text>
  <text x="644" y="462" font-size="12" fill="#6E6E73">worker finishes. Publishing now records an</text>
  <text x="644" y="480" font-size="12" fill="#6E6E73">acknowledged-degraded entry in the audit log.</text>
  <rect x="644" y="496" width="152" height="34" rx="10" fill="#FFF" stroke="#E5E5EA"/>
  <text x="720" y="518" font-size="13" font-weight="600" text-anchor="middle" fill="#1D1D1F">Wait for indexing</text>
  <rect x="806" y="496" width="146" height="34" rx="10" fill="#F5F5F7"/>
  <text x="879" y="518" font-size="13" font-weight="600" text-anchor="middle" fill="#6E6E73">Acknowledge</text>

  <text x="344" y="784" font-size="11" fill="#A1A1A6">This list is rendered from the engine’s required-checks read. Nothing here is guessed, and nothing is hardcoded.</text>

  <!-- right rail: publish summary -->
  <rect x="1080" y="56" width="360" height="776" fill="#FFF"/><path d="M1080 56 V832" stroke="#E5E5EA"/>
  <text x="1104" y="94" font-size="17" font-weight="600" fill="#1D1D1F">Publish</text>
  <text x="1104" y="114" font-size="12" fill="#6E6E73">Draft → version 1</text>
  <g filter="url(#s6)"><rect x="1104" y="136" width="312" height="120" rx="14" fill="#FAFAFC" stroke="#E5E5EA"/></g>
  <g font-size="12" fill="#6E6E73">
    <text x="1124" y="164">Content hash</text><text x="1396" y="164" text-anchor="end" fill="#1D1D1F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a41f…c92e</text>
    <text x="1124" y="188">Schema version</text><text x="1396" y="188" text-anchor="end" fill="#1D1D1F">2</text>
    <text x="1124" y="212">Snapshot</text><text x="1396" y="212" text-anchor="end" fill="#1D1D1F">created on publish</text>
    <text x="1124" y="236">Rollout</text><text x="1396" y="236" text-anchor="end" fill="#1D1D1F">100% at publish</text>
  </g>
  <rect x="1104" y="276" width="312" height="72" rx="12" fill="#FFF8EE" stroke="#FF9F0A" stroke-opacity="0.28"/>
  <text x="1124" y="304" font-size="12" font-weight="600" fill="#8A4B00">1 required item needs you</text>
  <text x="1124" y="324" font-size="11" fill="#8A4B00">Resolve knowledge coverage or acknowledge</text>
  <text x="1124" y="340" font-size="11" fill="#8A4B00">degraded knowledge to continue.</text>
  <text x="1104" y="382" font-size="12" fill="#0071E3">Jump to first issue</text>

  <text x="1104" y="430" font-size="11" font-weight="600" letter-spacing="0.9" fill="#A1A1A6">WHAT HAPPENS ON PUBLISH</text>
  <g font-size="12" fill="#6E6E73">
    <text x="1104" y="456">· Version 1 is inserted, never mutated later</text>
    <text x="1104" y="478">· A policy snapshot pins tools, knowledge,</text>
    <text x="1116" y="496">model refs and manifest hash</text>
    <text x="1104" y="518">· The active pointer moves atomically</text>
    <text x="1104" y="540">· In-flight runs stay pinned to their version</text>
    <text x="1104" y="562">· Rollback and retire stay on the agent page</text>
  </g>

  <!-- bottom bar -->
  <rect y="832" width="1440" height="68" fill="#FFF"/><path d="M0 832 H1440" stroke="#E5E5EA"/>
