<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <defs>
    <filter id="s1" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#F5F5F7"/>

  <!-- top bar : back link is the ONLY chrome in this state -->
  <g font-size="13" fill="#6E6E73">
    <path d="M44 34 L38 40 L44 46" fill="none" stroke="#6E6E73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="45">Fleet</text>
  </g>

  <!-- headline -->
  <text x="720" y="316" text-anchor="middle" font-size="32" font-weight="600" letter-spacing="-0.5" fill="#1D1D1F">What shall we build today?</text>
  <text x="720" y="350" text-anchor="middle" font-size="15" fill="#6E6E73">One sentence is enough. You can start from a blueprint instead.</text>

  <!-- ghost input -->
  <rect x="400" y="386" width="640" height="112" rx="16" fill="#FFF" stroke="#E5E5EA" filter="url(#s1)"/>
  <rect x="424" y="414" width="2" height="20" rx="1" fill="#0071E3"/>
  <text x="438" y="430" font-size="17" fill="#A1A1A6">A billing agent that resolves refund disputes using our policies…</text>
  <g>
    <rect x="424" y="466" width="34" height="19" rx="5" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="441" y="479" font-size="10" text-anchor="middle" fill="#86868B">Tab</text>
    <text x="466" y="479" font-size="11" fill="#A1A1A6">accept suggestion</text>
    <rect x="566" y="466" width="34" height="19" rx="5" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="583" y="479" font-size="10" text-anchor="middle" fill="#86868B">Esc</text>
    <text x="608" y="479" font-size="11" fill="#A1A1A6">dismiss</text>
    <text x="1016" y="479" font-size="11" text-anchor="end" fill="#C7C7CC">0 / 32,768</text>
  </g>

  <!-- origin tokens -->
  <g filter="url(#s1)">
    <rect x="453" y="538" width="182" height="38" rx="19" fill="#FFF" stroke="#E5E5EA"/>
    <rect x="647" y="538" width="170" height="38" rx="19" fill="#FFF" stroke="#E5E5EA"/>
    <rect x="829" y="538" width="158" height="38" rx="19" fill="#FFF" stroke="#E5E5EA"/>
  </g>
  <g fill="none" stroke="#6E6E73" stroke-width="1.4" stroke-linejoin="round">
    <rect x="471" y="550" width="12" height="9" rx="2"/><rect x="474" y="559" width="12" height="9" rx="2" fill="#FFF"/>
    <rect x="665" y="550" width="9" height="12" rx="2"/><rect x="674" y="554" width="9" height="12" rx="2" fill="#FFF"/>
    <path d="M847 551 v9 M843 556 l4 4 l4 -4" stroke-linecap="round"/><path d="M841 564 h12" stroke-linecap="round"/>
  </g>
  <g font-size="13" font-weight="500" fill="#1D1D1F">
    <text x="492" y="561">Browse Blueprints</text><text x="617" y="561" fill="#A1A1A6" font-weight="400">24</text>
    <text x="686" y="561">Mirror an Agent</text><text x="801" y="561" fill="#A1A1A6" font-weight="400">12</text>
    <text x="864" y="561">Import Blueprint</text>
  </g>

  <!-- recent shelf -->
  <text x="400" y="656" font-size="11" font-weight="600" letter-spacing="0.9" fill="#A1A1A6">CONTINUE SHAPING</text>
  <g filter="url(#s1)">
    <rect x="400" y="672" width="200" height="92" rx="14" fill="#FFF" stroke="#E5E5EA"/>
    <rect x="620" y="672" width="200" height="92" rx="14" fill="#FFF" stroke="#E5E5EA"/>
    <rect x="840" y="672" width="200" height="92" rx="14" fill="#FFF" stroke="#E5E5EA"/>
  </g>
  <g font-size="14" font-weight="600" fill="#1D1D1F">
    <text x="418" y="702">Billing Support</text>
    <text x="638" y="702">Support Agent</text>
    <text x="858" y="702">Sales SDR</text>
  </g>
  <g font-size="11" fill="#A1A1A6">
    <text x="418" y="722">Updated 2h ago</text><text x="638" y="722">Provisioning…</text><text x="858" y="722">Updated yesterday</text>
  </g>
  <!-- completeness rings -->
  <g fill="none" stroke-width="3">
    <circle cx="574" cy="696" r="10" stroke="#E5E5EA"/><path d="M574 686 A10 10 0 0 1 583 701" stroke="#34C759" stroke-linecap="round"/>
    <circle cx="794" cy="696" r="10" stroke="#E5E5EA"/><path d="M794 686 A10 10 0 0 1 800 688" stroke="#FF9F0A" stroke-linecap="round"/>
    <circle cx="1014" cy="696" r="10" stroke="#E5E5EA"/><path d="M1014 686 A10 10 0 0 1 1023 693" stroke="#C7C7CC" stroke-linecap="round"/>
  </g>
  <g font-size="11" fill="#6E6E73" font-weight="500">
    <text x="418" y="748">60% complete</text><text x="638" y="748">needs model</text><text x="858" y="748">25% complete</text>
  </g>

  <text x="720" y="836" text-anchor="middle" font-size="11" fill="#C7C7CC">Nothing is created until you continue. Leaving this screen loses nothing.</text>
</svg>