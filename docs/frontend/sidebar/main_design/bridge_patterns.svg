<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <defs>
    <filter id="bp" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.05"/>
    </filter>
    <marker id="ba" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M2.4,1.4 L6.4,4.5 L2.4,7.6" fill="none" stroke="#0071E3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="bg" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M2.4,1.4 L6.4,4.5 L2.4,7.6" fill="none" stroke="#B9B9C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#F5F5F7"/>
  <text x="48" y="52" font-size="24" font-weight="600" letter-spacing="-0.4" fill="#1D1D1F">The bridge pattern</text>
  <text x="48" y="78" font-size="14" fill="#6E6E73">Upload once → it lives in the library under its address → any agent pins the same address. Both directions, every library.</text>

  <!-- ============ AGENT A ============ -->
  <rect x="48" y="112" width="300" height="266" rx="14" fill="#FFF" stroke="#E5E5EA" filter="url(#bp)"/>
  <text x="68" y="140" font-size="9" font-weight="600" letter-spacing="0.8" fill="#A1A1A6">AGENT PLANE</text>
  <text x="68" y="162" font-size="14" font-weight="600" fill="#1D1D1F">Billing Support</text>
  <rect x="68" y="172" width="86" height="20" rx="10" fill="#EAF9EF" stroke="#34C759" stroke-opacity="0.3"/>
  <circle cx="82" cy="182" r="3.5" fill="#34C759"/>
  <text x="118" y="186" font-size="9.5" text-anchor="middle" fill="#1E7A3C">Published v1</text>
  <text x="68" y="216" font-size="9" font-weight="600" letter-spacing="0.7" fill="#A1A1A6">SNAPSHOT TOKEN · READ-ONLY</text>
  <rect x="68" y="224" width="260" height="86" rx="10" fill="#FAFAFC" stroke="#E5E5EA"/>
  <text x="82" y="243" font-size="10.5" font-weight="600" fill="#1D1D1F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">refund-policy</text>
  <text x="82" y="260" font-size="9" fill="#6E6E73">pinned document_version · v3</text>
  <text x="82" y="275" font-size="9" fill="#6E6E73" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hash 9f2c…41ab</text>
  <text x="82" y="290" font-size="9" fill="#6E6E73">embedding · text-embedding-3-large</text>
  <text x="82" y="305" font-size="9" fill="#1E7A3C">coverage 100%</text>
  <text x="68" y="336" font-size="10" fill="#6E6E73">Published 12 Aug against v3.</text>
  <text x="68" y="354" font-size="10" fill="#6E6E73">It keeps v3 forever unless its</text>
  <text x="68" y="370" font-size="10" fill="#6E6E73">content changes and it re-publishes.</text>

  <!-- ============ LIBRARY ============ -->
  <rect x="450" y="112" width="300" height="266" rx="14" fill="#FFF" stroke="#0071E3" stroke-opacity="0.35" filter="url(#bp)"/>
  <text x="470" y="140" font-size="9" font-weight="600" letter-spacing="0.8" fill="#0071E3">LIBRARY PLANE · KNOWLEDGE</text>
  <text x="470" y="162" font-size="14" font-weight="600" fill="#1D1D1F">refund-policy.pdf</text>
  <rect x="470" y="172" width="212" height="20" rx="10" fill="#F5F5F7" stroke="#E5E5EA"/>
  <text x="576" y="186" font-size="9.5" text-anchor="middle" fill="#6E6E73" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">source_slug: refund-policy</text>

  <text x="470" y="216" font-size="9" font-weight="600" letter-spacing="0.7" fill="#A1A1A6">VERSIONS</text>
  <g font-size="9.5" fill="#6E6E73">
    <text x="470" y="234">v1 · retired</text>
    <text x="470" y="250">v2 · retired</text>
    <text x="470" y="266" fill="#1D1D1F" font-weight="600">v3 · pinned by Billing Support</text>
    <text x="470" y="282" fill="#0058B0" font-weight="600">v4 · current — re-embedding 62%</text>
  </g>
  <g>
    <circle cx="742" cy="230" r="3" fill="#C7C7CC"/>
    <circle cx="742" cy="246" r="3" fill="#C7C7CC"/>
    <circle cx="742" cy="262" r="3" fill="#34C759"/>
    <circle cx="742" cy="278" r="3" fill="#0071E3"/>
  </g>

  <rect x="470" y="296" width="260" height="34" rx="9" fill="#FAFAFC" stroke="#E5E5EA"/>
  <text x="482" y="311" font-size="9.5" font-weight="600" fill="#1D1D1F">2 published agents</text>
  <text x="482" y="324" font-size="8.5" fill="#A1A1A6">drafts not included · from policy_snapshots</text>

  <g font-size="9.5">
    <rect x="470" y="340" width="150" height="26" rx="8" fill="#FFF8EE" stroke="#FF9F0A" stroke-opacity="0.32"/>
    <text x="545" y="357" text-anchor="middle" font-weight="600" fill="#8A4B00">Upload new version</text>
    <rect x="628" y="344" width="60" height="16" rx="8" fill="#FF9F0A" fill-opacity="0.14"/>
    <text x="658" y="355" text-anchor="middle" font-size="7.5" fill="#8A4B00">ORG-WIDE</text>
    <text x="470" y="374" fill="#0071E3" font-weight="600">Pin to an agent →</text>
    <text x="580" y="374" fill="#A1A1A6">carries returnTo</text>
  </g>

  <!-- ============ AGENT B ============ -->
  <rect x="852" y="112" width="300" height="266" rx="14" fill="#FFF" stroke="#E5E5EA" filter="url(#bp)"/>
  <text x="872" y="140" font-size="9" font-weight="600" letter-spacing="0.8" fill="#A1A1A6">AGENT PLANE</text>
  <text x="872" y="162" font-size="14" font-weight="600" fill="#1D1D1F">Support Agent</text>
  <rect x="872" y="172" width="52" height="20" rx="10" fill="#F5F5F7" stroke="#E5E5EA"/>
  <text x="898" y="186" font-size="9.5" text-anchor="middle" fill="#6E6E73">Draft</text>
  <text x="872" y="216" font-size="9" font-weight="600" letter-spacing="0.7" fill="#A1A1A6">DRAFT TOKEN · SLUG IS WRITABLE</text>
  <rect x="872" y="224" width="260" height="86" rx="10" fill="#FAFAFC" stroke="#E5E5EA"/>
  <text x="886" y="243" font-size="10.5" font-weight="600" fill="#1D1D1F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">refund-policy</text>
  <text x="886" y="260" font-size="9" fill="#6E6E73">draft holds the slug only</text>
  <text x="886" y="275" font-size="9" fill="#0058B0">resolves now to · v4</text>
  <text x="886" y="290" font-size="9" fill="#B25E00">coverage 62% → incomplete</text>
  <text x="886" y="305" font-size="9" fill="#B25E00">publish will ask to acknowledge</text>
  <text x="872" y="336" font-size="10" fill="#6E6E73">Publishing tomorrow pins v4 —</text>
  <text x="872" y="354" font-size="10" fill="#6E6E73">a different document than Agent A</text>
  <text x="872" y="370" font-size="10" fill="#6E6E73">serves, from the same address.</text>

  <!-- ============ ARROWS ============ -->
  <g fill="none" stroke="#0071E3" stroke-width="1.5" marker-end="url(#ba)">
    <path d="M352 190 H444"/>
    <path d="M444 300 H352"/>
    <path d="M756 190 H848"/>
    <path d="M848 300 H756"/>
  </g>
  <g font-size="8.5" fill="#0058B0" text-anchor="middle">
    <text x="398" y="182">inline upload</text>
    <text x="398" y="318">pin · returnTo</text>
    <text x="802" y="182">deep link</text>
    <text x="802" y="318">pin · returnTo</text>
  </g>

  <!-- ============ TRUTH STRIP ============ -->
  <rect x="48" y="404" width="1104" height="112" rx="14" fill="#FFF" stroke="#E5E5EA" filter="url(#bp)"/>
  <text x="72" y="432" font-size="10" font-weight="600" letter-spacing="0.9" fill="#A1A1A6">THE THREE TRUTHS THIS PATTERN RESTS ON</text>
  <g font-size="13" font-weight="600" fill="#1D1D1F">
    <text x="72" y="462">1 · Drafts reference by NAME</text>
    <text x="440" y="462">2 · Publish pins VERSION + HASH</text>
    <text x="836" y="462">3 · Same slug ≠ same content</text>
  </g>
  <g font-size="10.5" fill="#6E6E73">
    <text x="72" y="482">knowledge_policy holds slugs.</text>
    <text x="72" y="498">Writable by the maker, cheap to move.</text>
    <text x="440" y="482">policy_snapshots pins document_version</text>
    <text x="440" y="498">ids + hashes, tool schema hashes, model refs.</text>
    <text x="836" y="482">A on v3, B on v4 — both correct.</text>
    <text x="836" y="498">Show both layers or the UI tells a lie.</text>
  </g>

  <!-- ============ CONSEQUENCE STRIP ============ -->
  <rect x="48" y="536" width="1104" height="136" rx="14" fill="#FFF8EE" stroke="#FF9F0A" stroke-opacity="0.3" filter="url(#bp)"/>
  <text x="72" y="564" font-size="10" font-weight="600" letter-spacing="0.9" fill="#8A4B00">CONSEQUENCES — DESIGN AROUND THESE, DON’T DISCOVER THEM LATER</text>
  <g font-size="11.5" fill="#8A4B00">
    <text x="72" y="590" font-weight="600">No “re-pin to latest” action.</text>
    <text x="272" y="590">Publish auto-resolves slugs, so a button would invent capability.</text>
    <text x="72" y="612" font-weight="600">No re-publish of identical content.</text>
    <text x="290" y="612">The no-op guard compares payload hash only — identical payload is a 409,</text>
    <text x="290" y="628">even when the world drifted. Manifest drift alone cannot trigger a re-publish.</text>
    <text x="72" y="652" font-weight="600">So drift is adopted on the next content change.</text>
    <text x="392" y="652">Say it plainly: “Newer version available — picked up when this agent’s content next changes.”</text>
    <text x="72" y="668" fill="#B25E00">Prompt-only edits always publish (the manifest covers pins, bindings and refs — not prompt or params).</text>
  </g>

  <text x="48" y="700" font-size="10" fill="#A1A1A6">Every library works this way: Knowledge (slug) · Tools (name + schema_hash) · Models (catalog ref) · Templates (slug@version) · Datasets (id) · Memory (scope + visibility).</text>
</svg>