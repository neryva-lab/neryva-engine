  <text x="104" y="141" font-size="14" font-weight="600" fill="#F5F5F7">Studio<tspan fill="#0A84FF">·</tspan></text>
  <rect x="72" y="160" width="240" height="32" rx="9" fill="#08080C" stroke="#23232E"/>
  <text x="88" y="180" font-size="12" fill="#6E6E73">Search Studio…</text>
  <text x="72" y="220" font-size="10" font-weight="600" letter-spacing="1" fill="#6E6E73">SECTIONS</text>
  <g font-size="13">
