  <rect width="1440" height="900" fill="#0A0A0E"/>
  <text x="48" y="50" font-size="24" font-weight="600" letter-spacing="-0.4" fill="#F5F5F7">One sidebar, two levels — same shell, swapped content</text>
  <text x="48" y="74" font-size="13" fill="#8E8E93">Current dark language kept exactly. No second column ever. Chrome persists; only the nav region swaps.</text>

  <!-- ===== LEVEL 1 : domains ===== -->
