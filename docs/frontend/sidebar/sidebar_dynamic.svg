    <text x="104" y="330" font-weight="600" fill="#FFF">Agents</text>
    <rect x="72" y="346" width="240" height="34" rx="10" fill="none"/>
    <text x="104" y="368" fill="#A1A1A6">Libraries</text>
    <rect x="72" y="384" width="240" height="34" rx="10" fill="none"/>
    <text x="104" y="406" fill="#A1A1A6">Insights</text>
    <rect x="72" y="422" width="240" height="34" rx="10" fill="none"/>
    <text x="104" y="444" fill="#A1A1A6">Platform</text>
    <rect x="72" y="460" width="240" height="34" rx="10" fill="none"/>
    <text x="104" y="482" fill="#A1A1A6">Settings</text>
  </g>
  <g font-size="13" fill="#6E6E73" text-anchor="middle">
    <text x="88" y="254">▦</text><text x="88" y="292">✉</text><text x="88" y="368">▤</text>
    <text x="88" y="406">◔</text><text x="88" y="444">▣</text><text x="88" y="482">⚙</text>
  </g>
  <text x="88" y="330" font-size="13" text-anchor="middle" fill="#5AA9FF">✦</text>
  <circle cx="292" cy="325" r="9" fill="rgba(255,159,10,0.16)"/>
  <text x="292" y="329" font-size="10" font-weight="600" text-anchor="middle" fill="#FF9F0A">3</text>
  <text x="72" y="524" font-size="10" font-weight="600" letter-spacing="1" fill="#6E6E73">RECENT CHATS</text>
  <g font-size="12" fill="#A1A1A6">
    <text x="72" y="548">Refund policy question</text>
    <text x="72" y="570">Onboarding flow test</text>
  </g>
  <path d="M72 748 H312" stroke="#23232E"/>
  <circle cx="84" cy="778" r="13" fill="rgba(10,132,255,0.16)"/>
  <text x="84" y="782" font-size="10" font-weight="600" text-anchor="middle" fill="#5AA9FF">AS</text>
  <text x="106" y="774" font-size="12" font-weight="600" fill="#F5F5F7">Aurora Labs</text>
  <text x="106" y="790" font-size="11" fill="#6E6E73">Pro workspace</text>
  <text x="72" y="810" font-size="11" fill="#6E6E73">level 1 · sections</text>

  <!-- drill annotation -->
  <g text-anchor="middle">
    <path d="M348 460 h24 M364 454 l8 6 l-8 6" fill="none" stroke="#0A84FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="360" y="440" font-size="11" fill="#5AA9FF">tap drills in —</text>
    <text x="360" y="512" font-size="11" fill="#5AA9FF">same sidebar</text>
  </g>

  <!-- ===== LEVEL 2 : Agents section ===== -->
  <g filter="url(#sbs)"><rect x="384" y="104" width="288" height="724" rx="16" fill="url(#sbside)" stroke="#26262F"/></g>
  <rect x="408" y="124" width="24" height="24" rx="7" fill="url(#sbmark)"/>
  <text x="440" y="141" font-size="14" font-weight="600" fill="#F5F5F7">Studio<tspan fill="#0A84FF">·</tspan></text>
  <rect x="408" y="160" width="240" height="32" rx="9" fill="#08080C" stroke="#23232E"/>
  <text x="424" y="180" font-size="12" fill="#6E6E73">Filter section…</text>
  <text x="408" y="222" font-size="12" font-weight="600" fill="#5AA9FF">‹ All sections</text>
  <text x="408" y="248" font-size="15" font-weight="600" fill="#F5F5F7">Agents</text>
  <text x="408" y="266" font-size="11" fill="#6E6E73">Build and operate agents</text>
  <rect x="408" y="278" width="240" height="34" rx="10" fill="rgba(10,132,255,0.14)"/>
  <rect x="408" y="278" width="3" height="34" rx="1.5" fill="#0A84FF"/>
  <g font-size="13">
