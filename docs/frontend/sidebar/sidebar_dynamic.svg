    <text x="648" y="334">12</text><text x="648" y="368">20</text><text x="648" y="402">48</text>
  </g>
  <text x="648" y="436" font-size="11" text-anchor="end" fill="#FF9F0A">1 blocked</text>
  <text x="408" y="560" font-size="11" fill="#6E6E73">Provisioning: 1 seeding… · </text>
  <text x="578" y="560" font-size="11" fill="#5AA9FF">View</text>
  <path d="M408 748 H648" stroke="#23232E"/>
  <circle cx="420" cy="778" r="13" fill="rgba(10,132,255,0.16)"/>
  <text x="420" y="782" font-size="10" font-weight="600" text-anchor="middle" fill="#5AA9FF">AS</text>
  <text x="442" y="774" font-size="12" font-weight="600" fill="#F5F5F7">Aurora Labs</text>
  <text x="442" y="790" font-size="11" fill="#6E6E73">Pro workspace</text>
  <text x="408" y="810" font-size="11" fill="#6E6E73">level 2 · Agents section</text>

  <!-- ===== CONTRACT ===== -->
  <g filter="url(#sbs)"><rect x="704" y="104" width="688" height="724" rx="16" fill="#14141B" stroke="#26262F"/></g>
  <text x="736" y="140" font-size="11" font-weight="600" letter-spacing="1" fill="#6E6E73">SWAP CONTRACT — THE WHOLE SPEC IN ONE PANEL</text>

  <g font-size="13" font-weight="600" fill="#F5F5F7">
    <text x="736" y="178">1 · Chrome persists, nav region swaps</text>
    <text x="736" y="236">2 · Back never navigates</text>
    <text x="736" y="294">3 · Level follows the route, not memory</text>
    <text x="736" y="352">4 · Focus moves, screen reader told once</text>
    <text x="736" y="410">5 · Esc has an order</text>
    <text x="736" y="468">6 · Builder hides the sidebar entirely</text>
    <text x="736" y="526">7 · Dirty blocks everything alike</text>
    <text x="736" y="584">8 · Badges roll up, never shift</text>
  </g>
  <g font-size="11" fill="#8E8E93">
    <text x="736" y="196">Brand, search, footer, topbar, content stay. Slide ±12px, 200ms, instant on reduced-motion.</text>
    <text x="736" y="254">‹ All sections returns to level 1 on the same route. Logo goes to Dashboard.</text>
    <text x="736" y="312">Cold-load /blocks renders Platform › Blocks with zero prior state. No client state in derivation.</text>
    <text x="736" y="370">Focus to back control (level 2) or active row (level 1). aria-live announces the section once.</text>
    <text x="736" y="428">Modal → drawer → level-up → nothing. Desktop only; mobile drawer closes first.</text>
    <text x="736" y="486">/agents/new and /edit render full-bleed with ← Agents. Zero sidebars there.</text>
    <text x="736" y="544">useBlocker guards domain rows, back, items, breadcrumbs, palette, history. beforeunload for reload.</text>
    <text x="736" y="602">Null until data. Dot + count on both levels; domain rows show the rolled-up sum.</text>
  </g>

  <rect x="736" y="640" width="624" height="112" rx="12" fill="#0A0A0E" stroke="#26262F"/>
  <text x="756" y="666" font-size="10" font-weight="600" letter-spacing="1" fill="#6E6E73">LEDGER · SIDEBAR_LEDGER.md §§3–4</text>
  <g font-size="11" fill="#8E8E93">
    <text x="756" y="690">P1 skeleton (swap + mapping test + focus/Esc) → P2 homes → P3 Datasets · Blocks · Memory → P4 wiring.</text>
    <text x="756" y="708">Styling untouched — additive slide/back-row styles only. Agents work starts at P1 green.</text>
    <text x="756" y="726">nav.json v2 shape unchanged (already domain-based). One registry, four readers.</text>
  </g>

  <text x="736" y="796" font-size="11" fill="#6E6E73">Tokens: canvas #0A0A0E · sidebar gradient #14141B→#0E0E14 · hairline #26262F · accent #0A84FF · dot + word, always.</text>
</svg>
