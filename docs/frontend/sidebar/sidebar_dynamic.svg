<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <defs>
    <filter id="sbs" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="12" stdDeviation="28" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="sbside" x1="0" y1="0" x2="0" y2="1">
